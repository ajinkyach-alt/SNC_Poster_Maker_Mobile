name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev \
            build-essential ccache automake
      - name: Pre-download freetype (with retries)
        run: |
          mkdir -p ~/.buildozer/android/packages/freetype
          for i in 1 2 3 4 5 6 7 8; do
            curl -L --fail --retry 6 --retry-delay 10 --retry-connrefused \
              -o ~/.buildozer/android/packages/freetype/freetype-2.14.1.tar.gz \
              https://download.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz && break
            echo "Attempt $i failed, waiting 20s..."
            sleep 20
          done
      - name: Install buildozer & cython
        run: |
          pip install --upgrade pip
          pip install "cython<3.0" buildozer

      - name: Build APK with Buildozer
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Build attempt $attempt..."
            yes | buildozer android debug 2>&1
            if [ $? -eq 0 ]; then
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "Build failed, waiting before retry..."
              sleep 60
            fi
          done
          exit 1

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNC-Poster-Maker-APK
          path: bin/*.apk
